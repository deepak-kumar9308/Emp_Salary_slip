<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll - Employee Management</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg-color: #f4f7fb; --card-bg: #ffffff; --text-main: #333333; --text-muted: #777777; --success: #28a745; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: linear-gradient(180deg, var(--primary), var(--secondary)); color: white; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 20px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; text-align: center; }
        .nav-item { padding: 15px 20px; color: rgba(255,255,255,0.8); text-decoration: none; display: block; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: var(--text-main); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.Paid { background: #eef7ee; color: var(--success); }
        .badge.Unpaid, .badge.Pending { background: #fff8e5; color: #d97706; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">💼 EMS Portal</div>
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="employees.html" class="nav-item">Employees</a>
        <a href="departments.html" class="nav-item">Departments</a>
        <a href="attendance.html" class="nav-item">Attendance</a>
        <a href="leaves.html" class="nav-item">Leave Requests</a>
        <a href="payroll.html" class="nav-item active">Payroll</a>
        <a href="insights.html" class="nav-item" id="navInsights">Smart Insights</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Payroll Management</h1>
            <div id="adminActions" style="display:none; display:flex; gap: 10px;">
                <input type="number" id="genMonth" placeholder="Month (1-12)" min="1" max="12" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100px;">
                <input type="number" id="genYear" placeholder="Year" min="2000" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100px;">
                <button class="btn" onclick="generatePayroll()">Generate Payroll</button>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Month/Year</th>
                        <th>Employee</th>
                        <th>Gross Salary</th>
                        <th>Net Salary</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="payrollTable">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (!token) window.location.href = '/login.html';

        if (user.role === 'employee') {
            document.getElementById('navInsights').style.display = 'none';
        } else {
            document.getElementById('adminActions').style.display = 'flex';
            const now = new Date();
            document.getElementById('genMonth').value = now.getMonth() + 1;
            document.getElementById('genYear').value = now.getFullYear();
        }

        async function fetchPayroll() {
            try {
                const res = await fetch('/api/payroll', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('payrollTable');
                
                if (data.success && data.payrolls.length > 0) {
                    tbody.innerHTML = data.payrolls.map(p => {
                        const empName = p.employee ? `${p.employee.firstName} ${p.employee.lastName}` : 'N/A';
                        return `
                        <tr>
                            <td><strong>${p.month}/${p.year}</strong></td>
                            <td>${empName}</td>
                            <td>₹${p.grossSalary.toLocaleString('en-IN')}</td>
                            <td style="color:var(--success); font-weight:bold;">₹${p.netSalary.toLocaleString('en-IN')}</td>
                            <td><span class="badge ${p.paymentStatus}">${p.paymentStatus}</span></td>
                            <td>
                                <a href="/salary-slip.html" class="btn" style="padding: 5px 10px; font-size: 12px; background: #333;">View Slip</a>
                            </td>
                        </tr>
                    `;}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No payroll records found.</td></tr>';
                }
            } catch (err) { console.error(err); }
        }

        async function generatePayroll() {
            const m = document.getElementById('genMonth').value;
            const y = document.getElementById('genYear').value;
            if(!m || !y) return alert('Enter month and year');
            
            if(confirm(`Generate payroll for all active employees for ${m}/${y}?`)) {
                const res = await fetch('/api/payroll/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ month: m, year: y })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) fetchPayroll();
            }
        }

        fetchPayroll();
    </script>
</body>
</html>
