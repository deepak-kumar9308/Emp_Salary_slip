<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Employee Management</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg-color: #f4f7fb; --card-bg: #ffffff; --text-main: #333333; --text-muted: #777777; --success: #28a745; --danger: #dc3545; --warning: #ffc107; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: linear-gradient(180deg, var(--primary), var(--secondary)); color: white; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 20px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; text-align: center; }
        .nav-item { padding: 15px 20px; color: rgba(255,255,255,0.8); text-decoration: none; display: block; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: var(--text-main); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.Present { background: #eef7ee; color: var(--success); }
        .badge.Absent { background: #fdeaea; color: var(--danger); }
        .badge.Late { background: #fff8e5; color: var(--warning); }
        .badge.WFH { background: #e0f2fe; color: #0284c7; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">💼 EMS Portal</div>
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="employees.html" class="nav-item">Employees</a>
        <a href="departments.html" class="nav-item">Departments</a>
        <a href="attendance.html" class="nav-item active">Attendance</a>
        <a href="leaves.html" class="nav-item">Leave Requests</a>
        <a href="payroll.html" class="nav-item">Payroll</a>
        <a href="insights.html" class="nav-item" id="navInsights">Smart Insights</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Attendance Tracking</h1>
            <button class="btn" onclick="openModal()" id="markBtn">Mark Attendance</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Employee</th>
                        <th>Status</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                    </tr>
                </thead>
                <tbody id="attTable">
                    <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="attModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Mark Attendance</h2>
            <form id="attForm">
                <div class="form-group" id="empSelectDiv" style="display:none;">
                    <label>Select Employee</label>
                    <select id="attEmployee">
                        <option value="">Select Employee...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="attDate" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="attStatus">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                        <option value="Work From Home">Work From Home</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Check In Time</label>
                    <input type="time" id="attCheckIn">
                </div>
                <div class="form-group">
                    <label>Check Out Time</label>
                    <input type="time" id="attCheckOut">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (!token) window.location.href = '/login.html';

        if (user.role === 'employee') {
            document.getElementById('navInsights').style.display = 'none';
        } else {
            document.getElementById('empSelectDiv').style.display = 'block';
        }

        async function loadEmployeeOptions() {
            if (user.role === 'employee') return;
            try {
                const res = await fetch('/api/employees', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success && data.employees.length > 0) {
                    const select = document.getElementById('attEmployee');
                    select.innerHTML = '<option value="">Select Employee...</option>' + 
                        data.employees.map(e => `<option value="${e._id}">${e.firstName} ${e.lastName} (${e.employeeId})</option>`).join('');
                }
            } catch (err) {
                console.error("Error loading employees:", err);
            }
        }

        async function fetchAttendance() {
            try {
                const res = await fetch('/api/attendance', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('attTable');
                
                if (data.success && data.attendance.length > 0) {
                    tbody.innerHTML = data.attendance.map(a => {
                        const statusClass = a.status === 'Work From Home' ? 'WFH' : a.status;
                        const empName = a.employee ? `${a.employee.firstName} ${a.employee.lastName}` : 'N/A';
                        return `
                        <tr>
                            <td><strong>${new Date(a.date).toLocaleDateString()}</strong></td>
                            <td>${empName}</td>
                            <td><span class="badge ${statusClass}">${a.status}</span></td>
                            <td>${a.checkIn || '-'}</td>
                            <td>${a.checkOut || '-'}</td>
                        </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No attendance records found.</td></tr>';
                }
            } catch (err) { console.error(err); }
        }

        function openModal() { 
            loadEmployeeOptions();
            document.getElementById('attModal').style.display = 'flex'; 
            document.getElementById('attDate').valueAsDate = new Date();
        }
        function closeModal() { document.getElementById('attModal').style.display = 'none'; document.getElementById('attForm').reset(); }

        document.getElementById('attForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                date: document.getElementById('attDate').value,
                status: document.getElementById('attStatus').value,
                checkIn: document.getElementById('attCheckIn').value,
                checkOut: document.getElementById('attCheckOut').value
            };
            if (user.role !== 'employee') {
                payload.employee = document.getElementById('attEmployee').value;
                if(!payload.employee) return alert("Please select an employee.");
            } else {
                payload.employee = user.employee;
            }

            const res = await fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) { closeModal(); fetchAttendance(); }
            else { alert(data.message); }
        });

        fetchAttendance();
    </script>
</body>
</html>
