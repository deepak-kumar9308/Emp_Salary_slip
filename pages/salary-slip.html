<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salary Slip</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3f6fb;

            padding: 30px;
        }

        .topbar {
            max-width: 900px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }

        .topbar h2 {
            color: #333;
        }

        .logout {
            padding: 10px 18px;

            background: #dc3545;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;
        }

        .logout:hover {
            background: #c82333;
        }

        .salary-container {
            max-width: 900px;

            margin: auto;

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.1);
        }

        .header {
            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            padding: 30px;

            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
        }

        .employee-info {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            padding: 30px;

            border-bottom: 1px solid #eee;
        }

        .info-box {
            background: #f7f8fc;

            padding: 18px;

            border-radius: 10px;
        }

        .info-label {
            color: #777;

            font-size: 13px;

            margin-bottom: 6px;
        }

        .info-value {
            font-weight: bold;

            word-break: break-word;
        }

        .salary-section {
            padding: 30px;
        }

        .salary-row {
            display: flex;

            justify-content: space-between;

            padding: 17px 10px;

            border-bottom: 1px solid #eee;
        }

        .salary-row:last-child {
            border-bottom: none;
        }

        .salary-row span:last-child {
            font-weight: bold;
        }

        .gross {
            font-size: 18px;
        }

        .net {
            margin-top: 10px;

            padding: 20px;

            border-radius: 10px;

            background: #eef7ee;

            font-size: 22px;

            font-weight: bold;

            display: flex;

            justify-content: space-between;
        }

        .actions {
            padding: 0 30px 30px;

            display: flex;

            gap: 15px;
        }

        .action-button {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 15px;
        }

        .print {
            background: #667eea;

            color: white;
        }

        .print:hover {
            background: #5568d9;
        }

        .loading {
            text-align: center;

            padding: 60px;

            font-size: 20px;
        }

        .error {
            text-align: center;

            padding: 60px;

            color: red;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .employee-info {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;

                gap: 15px;
            }

            .actions {
                flex-direction: column;
            }

        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .topbar,
            .actions {
                display: none;
            }

            .salary-container {
                box-shadow: none;
            }

        }

    </style>

</head>

<body>

<div class="topbar">

    <h2>
        Employee Portal
    </h2>

    <a
        href="/logout"
        class="logout"
    >
        Logout
    </a>

</div>

<div
    id="content"
    class="salary-container"
>

    <div class="loading">
        Loading salary slip...
    </div>

</div>

<script>
async function loadSalarySlip() {
    const content = document.getElementById("content");
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');

    if (!token || !userStr) {
        window.location.href = "/login.html";
        return;
    }

    try {
        const response = await fetch("/api/salary-slips?limit=1", {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        const result = await response.json();

        if (!result.success) {
            content.innerHTML = `<div class="error">${result.message || 'Error loading slip.'}</div>`;
            return;
        }

        if (result.slips.length === 0) {
            content.innerHTML = `
                <div class="header">
                    <h1>Employee Salary Slip</h1>
                </div>
                <div class="error" style="color: #666;">No salary slips have been generated for you yet.</div>
            `;
            return;
        }

        const slip = result.slips[0];
        const snapshot = slip.salarySnapshot;

        content.innerHTML = `
            <div class="header">
                <h1>Employee Salary Slip</h1>
                <p>Salary Management System - ${slip.month}/${slip.year}</p>
            </div>

            <div class="employee-info">
                <div class="info-box">
                    <div class="info-label">Employee Name</div>
                    <div class="info-value">${escapeHTML(snapshot?.employee?.name || slip.employee?.firstName + ' ' + slip.employee?.lastName || 'N/A')}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Employee ID</div>
                    <div class="info-value">${escapeHTML(snapshot?.employee?.employeeId || slip.employee?.employeeId || 'N/A')}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Email</div>
                    <div class="info-value">${escapeHTML(snapshot?.employee?.email || slip.employee?.email || 'N/A')}</div>
                </div>
            </div>

            <div class="salary-section">
                <div style="display:flex; justify-content: space-between; gap: 20px;">
                    <div style="flex:1;">
                        <h3 style="margin-bottom:15px; color:#555; border-bottom:1px solid #eee; padding-bottom:10px;">Earnings</h3>
                        <div class="salary-row"><span>Basic Salary</span><span>₹${formatMoney(snapshot.basicSalary)}</span></div>
                        <div class="salary-row"><span>HRA</span><span>₹${formatMoney(snapshot.hra)}</span></div>
                        <div class="salary-row"><span>Conveyance</span><span>₹${formatMoney(snapshot.conveyanceAllowance)}</span></div>
                        <div class="salary-row"><span>Medical</span><span>₹${formatMoney(snapshot.medicalAllowance)}</span></div>
                        <div class="salary-row"><span>Special</span><span>₹${formatMoney(snapshot.specialAllowance)}</span></div>
                        ${snapshot.bonus > 0 ? `<div class="salary-row"><span>Bonus</span><span>₹${formatMoney(snapshot.bonus)}</span></div>` : ''}
                        <div class="salary-row gross" style="margin-top:15px; border-top:1px solid #ccc;">
                            <span>Gross Salary</span><span>₹${formatMoney(snapshot.grossSalary)}</span>
                        </div>
                    </div>
                    <div style="flex:1;">
                        <h3 style="margin-bottom:15px; color:#555; border-bottom:1px solid #eee; padding-bottom:10px;">Deductions</h3>
                        <div class="salary-row"><span>PF</span><span>- ₹${formatMoney(snapshot.pf)}</span></div>
                        <div class="salary-row"><span>Prof. Tax</span><span>- ₹${formatMoney(snapshot.professionalTax)}</span></div>
                        <div class="salary-row"><span>TDS</span><span>- ₹${formatMoney(snapshot.tds)}</span></div>
                        ${snapshot.unpaidLeaveDays > 0 ? `<div class="salary-row"><span>Unpaid Leave</span><span>- ₹${formatMoney(snapshot.otherDeductions)}</span></div>` : ''}
                        <div class="salary-row gross" style="margin-top:15px; border-top:1px solid #ccc;">
                            <span>Total Deductions</span><span>- ₹${formatMoney(snapshot.totalDeductions)}</span>
                        </div>
                    </div>
                </div>

                <div class="net">
                    <span>Net Salary Payable</span>
                    <span>₹${formatMoney(snapshot.netSalary)}</span>
                </div>
            </div>

            <div class="actions">
                <button class="action-button print" onclick="window.print()">
                    🖨️ Print Salary Slip
                </button>
                <button class="action-button" style="background:#28a745; color:white;" onclick="downloadPDF('${slip._id}')">
                    📄 Download PDF
                </button>
            </div>
        `;

    } catch (error) {
        content.innerHTML = `
            <div class="error">
                Unable to load salary slip.
                <br><br>
                Please login again.
            </div>
        `;
    }
}

async function downloadPDF(id) {
    const token = localStorage.getItem('token');
    try {
        const response = await fetch(`/api/salary-slips/${id}/download`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `SalarySlip_${id}.pdf`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        } else {
            alert('Failed to download PDF.');
        }
    } catch(err) {
        alert('Error downloading PDF.');
    }
}

function formatMoney(value) {
    return Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

// Intercept logout link to remove token
document.querySelector('.logout').addEventListener('click', function(e) {
    e.preventDefault();
    const token = localStorage.getItem('token');
    if(token) {
        fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
    }
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login.html';
});

loadSalarySlip();
</script>
</body>
</html>
