<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaves - Employee Management</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg-color: #f4f7fb; --card-bg: #ffffff; --text-main: #333333; --text-muted: #777777; --success: #28a745; --warning: #ffc107; --danger: #dc3545; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: linear-gradient(180deg, var(--primary), var(--secondary)); color: white; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 20px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; text-align: center; }
        .nav-item { padding: 15px 20px; color: rgba(255,255,255,0.8); text-decoration: none; display: block; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 24px; color: var(--text-main); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { padding: 8px 12px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 13px; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.Pending { background: #fff8e5; color: var(--warning); }
        .badge.Approved { background: #eef7ee; color: var(--success); }
        .badge.Rejected, .badge.Cancelled { background: #fdeaea; color: var(--danger); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">💼 EMS Portal</div>
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="employees.html" class="nav-item">Employees</a>
        <a href="departments.html" class="nav-item">Departments</a>
        <a href="attendance.html" class="nav-item">Attendance</a>
        <a href="leaves.html" class="nav-item active">Leave Requests</a>
        <a href="payroll.html" class="nav-item">Payroll</a>
        <a href="insights.html" class="nav-item" id="navInsights">Smart Insights</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Leave Requests</h1>
            <button class="btn" onclick="openModal()">Apply Leave</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Type</th>
                        <th>Duration</th>
                        <th>Days</th>
                        <th>Status</th>
                        <th id="actionsHeader">Actions</th>
                    </tr>
                </thead>
                <tbody id="leaveTable">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="leaveModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Apply for Leave</h2>
            <form id="leaveForm">
                <div class="form-group" id="empSelectDiv" style="display:none;">
                    <label>Select Employee</label>
                    <select id="leaveEmployee">
                        <option value="">Select Employee...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Leave Type</label>
                    <select id="leaveType">
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                        <option value="Emergency Leave">Emergency Leave</option>
                        <option value="Unpaid Leave">Unpaid Leave</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <textarea id="reason" rows="3" required></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Submit Request</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        if (!token) window.location.href = '/login.html';

        if (user.role === 'employee') {
            document.getElementById('navInsights').style.display = 'none';
        } else {
            document.getElementById('empSelectDiv').style.display = 'block';
        }

        async function loadEmployeeOptions() {
            if (user.role === 'employee') return;
            try {
                const res = await fetch('/api/employees', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success && data.employees.length > 0) {
                    const select = document.getElementById('leaveEmployee');
                    select.innerHTML = '<option value="">Select Employee...</option>' + 
                        data.employees.map(e => `<option value="${e._id}">${e.firstName} ${e.lastName} (${e.employeeId})</option>`).join('');
                }
            } catch (err) {
                console.error("Error loading employees:", err);
            }
        }

        async function fetchLeaves() {
            try {
                const res = await fetch('/api/leaves', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tbody = document.getElementById('leaveTable');
                
                if (data.success && data.leaves.length > 0) {
                    tbody.innerHTML = data.leaves.map(l => {
                        const empName = l.employee ? `${l.employee.firstName} ${l.employee.lastName}` : 'N/A';
                        return `
                        <tr>
                            <td><strong>${empName}</strong></td>
                            <td>${l.leaveType}</td>
                            <td>${new Date(l.startDate).toLocaleDateString()} to ${new Date(l.endDate).toLocaleDateString()}</td>
                            <td>${l.numberOfDays}</td>
                            <td><span class="badge ${l.status.replace(' ','')}">${l.status}</span></td>
                            <td>
                                ${l.status === 'Pending' && (user.role === 'admin' || user.role === 'hr') ? `
                                    <button class="btn btn-success" onclick="updateStatus('${l._id}', 'Approved')">✓</button>
                                    <button class="btn btn-danger" onclick="updateStatus('${l._id}', 'Rejected')">✗</button>
                                ` : ''}
                                ${l.status === 'Pending' && user.role === 'employee' ? `
                                    <button class="btn btn-danger" onclick="cancelLeave('${l._id}')">Cancel</button>
                                ` : ''}
                                ${l.status !== 'Pending' ? '-' : ''}
                            </td>
                        </tr>
                    `;}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No leave requests found.</td></tr>';
                }
            } catch (err) { console.error(err); }
        }

        async function updateStatus(id, status) {
            if(confirm(`Are you sure you want to ${status.toLowerCase()} this leave?`)) {
                await fetch(`/api/leaves/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status })
                });
                fetchLeaves();
            }
        }

        async function cancelLeave(id) {
            if(confirm('Cancel this leave request?')) {
                await fetch(`/api/leaves/${id}/cancel`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
                fetchLeaves();
            }
        }

        function openModal() { 
            loadEmployeeOptions();
            document.getElementById('leaveModal').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('leaveModal').style.display = 'none'; document.getElementById('leaveForm').reset(); }

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                leaveType: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                reason: document.getElementById('reason').value
            };
            if (user.role !== 'employee') {
                payload.employee = document.getElementById('leaveEmployee').value;
                if (!payload.employee) return alert("Please select an employee.");
            }

            const res = await fetch('/api/leaves', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) { closeModal(); fetchLeaves(); }
            else { alert(data.message); }
        });

        fetchLeaves();
    </script>
</body>
</html>
