<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .email {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 25px;
            word-break: break-word;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            text-align: center;

            font-size: 24px;

            letter-spacing: 8px;

            outline: none;

            margin-bottom: 20px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;

            padding: 14px;

            background: #667eea;

            border: none;

            border-radius: 8px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;

            margin-top: 20px;

            color: #667eea;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        📧
    </div>

    <h1>
        Verify Your Email
    </h1>

    <p class="description">
        We have sent a 6-digit verification
        code to:
    </p>

    <div
        id="email"
        class="email"
    >
        Loading...
    </div>

    <form id="otpForm">

        <input
            type="text"
            id="otp"
            name="otp"
            placeholder="000000"
            maxlength="6"
            pattern="[0-9]{6}"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/signup.html"
        class="back"
    >
        ← Back to Signup
    </a>

</div>

<script>

const email =
    sessionStorage.getItem("otpEmail");

const emailElement =
    document.getElementById("email");

const form =
    document.getElementById("otpForm");

const message =
    document.getElementById("message");

if (!email) {

    emailElement.textContent =
        "No email found";

} else {

    emailElement.textContent =
        email;
}

document
    .getElementById("otp")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        if (!email) {

            message.textContent =
                "Email not found.";

            message.style.color =
                "red";

            return;
        }

        const otp =
            document
                .getElementById("otp")
                .value;

        message.textContent =
            "Verifying OTP...";

        message.style.color =
            "#333";

        try {

            const response =
                await fetch(
                    "/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                email: email,
                                otp: otp
                            }).toString()
                    }
                );

            const result =
                await response.json();

            if (result.success) {

                message.textContent =
                    result.message;

                message.style.color =
                    "green";

                sessionStorage.removeItem(
                    "otpEmail"
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "/login.html";

                    },
                    1000
                );

            } else {

                message.textContent =
                    result.message;

                message.style.color =
                    "red";
            }

        } catch (error) {

            message.textContent =
                "Server connection failed.";

            message.style.color =
                "red";
        }

    }
);

</script>

</body>

</html>
